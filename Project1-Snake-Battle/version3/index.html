<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Battle Arena</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121214;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 0 0 6px 0;
            background: linear-gradient(90deg, #4CAF50, #81C784);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #top-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 12px;
        }

        #score-board {
            font-size: 20px;
            font-weight: bold;
            background: #1e1e24;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        #score-board span {
            color: #4CAF50;
        }

        #color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            background: #1e1e24;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        .color-option {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .color-option:hover {
            transform: scale(1.2);
        }

        .color-option.selected {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
        }

        #game-wrapper {
            position: relative;
            display: flex;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #2d3238;
        }

        #game-canvas {
            background-color: #0b0c10;
            display: block;
        }

        #leaderboard {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(4px);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 13px;
            min-width: 140px;
            pointer-events: none;
        }

        #leaderboard h4 {
            margin: 0 0 8px 0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .leaderboard-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .controls-info {
            margin-top: 12px;
            font-size: 13px;
            color: #777;
        }

        #game-over-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 20, 0.95);
            padding: 24px 36px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #ff4444;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        #restart-btn {
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 14px;
            transition: opacity 0.2s, transform 0.1s;
        }

        #restart-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">🐍 Snake Battle Arena</h1>
    </div>

    <div id="top-bar">
        <div id="score-board">Score: <span id="score">0</span></div>

        <div id="color-picker-container">
            <span>Color:</span>
            <div class="color-option selected" style="background-color: #4CAF50;" data-color="#4CAF50" data-head="#81C784" title="Green"></div>
            <div class="color-option" style="background-color: #2196F3;" data-color="#2196F3" data-head="#64B5F6" title="Blue"></div>
            <div class="color-option" style="background-color: #9C27B0;" data-color="#9C27B0" data-head="#BA68C8" title="Purple"></div>
            <div class="color-option" style="background-color: #FF9800;" data-color="#FF9800" data-head="#FFB74D" title="Orange"></div>
            <div class="color-option" style="background-color: #E91E63;" data-color="#E91E63" data-head="#F06292" title="Pink"></div>
            <div class="color-option" style="background-color: #00BCD4;" data-color="#00BCD4" data-head="#4DD0E1" title="Cyan"></div>
        </div>
    </div>

    <div id="game-wrapper">
        <canvas id="game-canvas" width="600" height="600"></canvas>

        <div id="leaderboard">
            <h4>Leaderboard</h4>
            <div id="leaderboard-content"></div>
        </div>

        <div id="game-over-modal">
            <h2 style="color: #ff5252; margin: 0 0 10px 0;">Defeated!</h2>
            <p style="color: #ccc; margin: 0;">Final Score: <b id="final-score" style="color: #fff; font-size: 18px;">0</b></p>
            <p style="color: #888; font-size: 13px; margin: 6px 0 0 0;">Kills: <span id="final-kills">0</span></p>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <div class="controls-info">Controls: <b>Arrow Keys</b> or <b>W / A / S / D</b></div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('final-score');
        const finalKillsElement = document.getElementById('final-kills');
        const gameOverModal = document.getElementById('game-over-modal');
        const restartBtn = document.getElementById('restart-btn');
        const leaderboardContent = document.getElementById('leaderboard-content');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let playerSnake = {};
        let botSnakes = [];
        let fruits = [];
        let score = 0;
        let kills = 0;
        let gameLoop = null;
        let isGameOver = false;

        let playerBodyColor = '#4CAF50';
        let playerHeadColor = '#81C784';

        const BOT_CONFIGS = [
            { name: 'Red Viper', bodyColor: '#E53935', headColor: '#EF5350' },
            { name: 'Blaze Snake', bodyColor: '#FB8C00', headColor: '#FFA726' },
            { name: 'Shadow Drake', bodyColor: '#8E24AA', headColor: '#AB47BC' }
        ];

        const colorOptions = document.querySelectorAll('.color-option');
        colorOptions.forEach(option => {
            option.addEventListener('click', () => {
                colorOptions.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                playerBodyColor = option.getAttribute('data-color');
                playerHeadColor = option.getAttribute('data-head');
                if (playerSnake.alive) {
                    playerSnake.bodyColor = playerBodyColor;
                    playerSnake.headColor = playerHeadColor;
                }
            });
        });

        const FRUIT_PALETTE = ['#FF5252', '#FF4081', '#FFB300', '#FFEA00', '#E040FB', '#00E676'];

        function getRandomFruitColor() {
            return FRUIT_PALETTE[Math.floor(Math.random() * FRUIT_PALETTE.length)];
        }

        function createBotSnake(config, startX, startY, dirX, dirY) {
            return {
                name: config.name,
                body: [
                    { x: startX, y: startY },
                    { x: startX - dirX, y: startY - dirY },
                    { x: startX - dirX * 2, y: startY - dirY * 2 }
                ],
                dx: dirX,
                dy: dirY,
                bodyColor: config.bodyColor,
                headColor: config.headColor,
                isBot: true,
                alive: true,
                respawnTimer: 0
            };
        }

        function initGame() {
            score = 0;
            kills = 0;
            isGameOver = false;
            scoreElement.textContent = score;
            gameOverModal.style.display = 'none';

            playerSnake = {
                name: 'You',
                body: [
                    { x: 15, y: 15 },
                    { x: 14, y: 15 },
                    { x: 13, y: 15 }
                ],
                dx: 1,
                dy: 0,
                nextDx: 1,
                nextDy: 0,
                bodyColor: playerBodyColor,
                headColor: playerHeadColor,
                isBot: false,
                alive: true
            };

            botSnakes = [
                createBotSnake(BOT_CONFIGS[0], 5, 5, 0, 1),
                createBotSnake(BOT_CONFIGS[1], 25, 5, 0, 1),
                createBotSnake(BOT_CONFIGS[2], 25, 25, -1, 0)
            ];

            fruits = [];
            for (let i = 0; i < 6; i++) {
                spawnFruit();
            }

            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 110);
            updateLeaderboard();
        }

        function isOccupied(x, y) {
            if (playerSnake.alive && playerSnake.body.some(seg => seg.x === x && seg.y === y)) {
                return true;
            }
            for (const bot of botSnakes) {
                if (bot.alive && bot.body.some(seg => seg.x === x && seg.y === y)) {
                    return true;
                }
            }
            return false;
        }

        function spawnFruit() {
            let attempts = 0;
            while (attempts < 100) {
                const x = Math.floor(Math.random() * TILE_COUNT);
                const y = Math.floor(Math.random() * TILE_COUNT);
                const onFruit = fruits.some(f => f.x === x && f.y === y);
                if (!onFruit && !isOccupied(x, y)) {
                    fruits.push({ x, y, color: getRandomFruitColor() });
                    break;
                }
                attempts++;
            }
        }

        function convertSnakeToFruit(snake) {
            snake.body.forEach(segment => {
                fruits.push({
                    x: segment.x,
                    y: segment.y,
                    color: snake.bodyColor || getRandomFruitColor()
                });
            });
        }

        function decideBotMove(bot) {
            const head = bot.body[0];
            const directions = [
                { dx: 0, dy: -1 },
                { dx: 0, dy: 1 },
                { dx: -1, dy: 0 },
                { dx: 1, dy: 0 }
            ];

            const validDirs = directions.filter(d => !(d.dx === -bot.dx && d.dy === -bot.dy));

            let targetFruit = null;
            let minDistance = Infinity;
            fruits.forEach(f => {
                const dist = Math.abs(f.x - head.x) + Math.abs(f.y - head.y);
                if (dist < minDistance) {
                    minDistance = dist;
                    targetFruit = f;
                }
            });

            let bestDir = validDirs[0];
            let bestScore = -Infinity;

            validDirs.forEach(dir => {
                const nextX = head.x + dir.dx;
                const nextY = head.y + dir.dy;

                if (nextX < 0 || nextX >= TILE_COUNT || nextY < 0 || nextY >= TILE_COUNT) {
                    return;
                }

                if (isOccupied(nextX, nextY)) {
                    return;
                }

                let moveScore = 100;
                if (targetFruit) {
                    const distToFruit = Math.abs(targetFruit.x - nextX) + Math.abs(targetFruit.y - nextY);
                    moveScore -= distToFruit;
                }

                if (moveScore > bestScore) {
                    bestScore = moveScore;
                    bestDir = dir;
                }
            });

            bot.dx = bestDir.dx;
            bot.dy = bestDir.dy;
        }

        function updateLeaderboard() {
            const all = [playerSnake, ...botSnakes];
            all.sort((a, b) => {
                const lenA = a.alive ? a.body.length : 0;
                const lenB = b.alive ? b.body.length : 0;
                return lenB - lenA;
            });

            leaderboardContent.innerHTML = all.map(s => {
                const isAlive = s.alive;
                const color = s.bodyColor;
                const name = s.isBot ? s.name : 'You';
                const length = isAlive ? s.body.length : 'Dead';
                return `
                    <div class="leaderboard-row" style="opacity: ${isAlive ? '1' : '0.45'}; font-weight: ${!s.isBot ? 'bold' : 'normal'};">
                        <span><span class="leaderboard-dot" style="background-color: ${color};"></span>${name}</span>
                        <span>${length}</span>
                    </div>
                `;
            }).join('');
        }

        function update() {
            if (isGameOver) return;

            playerSnake.dx = playerSnake.nextDx;
            playerSnake.dy = playerSnake.nextDy;

            botSnakes.forEach((bot, idx) => {
                if (bot.alive) {
                    decideBotMove(bot);
                } else {
                    bot.respawnTimer++;
                    if (bot.respawnTimer > 25) {
                        const config = BOT_CONFIGS[idx % BOT_CONFIGS.length];
                        const rx = Math.floor(Math.random() * (TILE_COUNT - 6)) + 3;
                        const ry = Math.floor(Math.random() * (TILE_COUNT - 6)) + 3;
                        const spawnedBot = createBotSnake(config, rx, ry, 1, 0);
                        bot.body = spawnedBot.body;
                        bot.dx = spawnedBot.dx;
                        bot.dy = spawnedBot.dy;
                        bot.bodyColor = spawnedBot.bodyColor;
                        bot.headColor = spawnedBot.headColor;
                        bot.alive = true;
                        bot.respawnTimer = 0;
                    }
                }
            });

            const allSnakes = [playerSnake, ...botSnakes];
            const deadSnakes = [];

            allSnakes.forEach(snake => {
                if (!snake.alive) return;
                const head = snake.body[0];
                snake.nextHead = { x: head.x + snake.dx, y: head.y + snake.dy };
            });

            allSnakes.forEach(snake => {
                if (!snake.alive) return;
                const nextHead = snake.nextHead;

                if (nextHead.x < 0 || nextHead.x >= TILE_COUNT || nextHead.y < 0 || nextHead.y >= TILE_COUNT) {
                    deadSnakes.push({ snake, killer: null });
                    return;
                }

                for (const otherSnake of allSnakes) {
                    if (!otherSnake.alive) continue;

                    if (otherSnake === snake) {
                        if (snake.body.slice(0, -1).some(seg => seg.x === nextHead.x && seg.y === nextHead.y)) {
                            deadSnakes.push({ snake, killer: snake });
                            break;
                        }
                    } else {
                        if (otherSnake.body.some(seg => seg.x === nextHead.x && seg.y === nextHead.y)) {
                            deadSnakes.push({ snake, killer: otherSnake });
                            break;
                        }
                        if (otherSnake.nextHead && otherSnake.nextHead.x === nextHead.x && otherSnake.nextHead.y === nextHead.y) {
                            deadSnakes.push({ snake, killer: otherSnake });
                            break;
                        }
                    }
                }
            });

            deadSnakes.forEach(({ snake, killer }) => {
                if (!snake.alive) return;
                snake.alive = false;
                convertSnakeToFruit(snake);

                if (killer && !killer.isBot && snake.isBot) {
                    kills++;
                    score += 50;
                    scoreElement.textContent = score;
                }

                if (!snake.isBot) {
                    handleGameOver();
                }
            });

            allSnakes.forEach(snake => {
                if (!snake.alive) return;

                const nextHead = snake.nextHead;
                snake.body.unshift(nextHead);

                const fruitIndex = fruits.findIndex(f => f.x === nextHead.x && f.y === nextHead.y);
                if (fruitIndex !== -1) {
                    fruits.splice(fruitIndex, 1);
                    if (!snake.isBot) {
                        score += 10;
                        scoreElement.textContent = score;
                    }
                } else {
                    snake.body.pop();
                }
            });

            while (fruits.length < 6) {
                spawnFruit();
            }

            updateLeaderboard();
            draw();
        }

        function drawSnakeEyes(headX, headY, dirX, dirY) {
            ctx.fillStyle = '#ffffff';
            let eye1X, eye1Y, eye2X, eye2Y;
            const eyeSize = 3.5;
            const pupilSize = 1.8;

            if (dirX === 1) { // Right
                eye1X = headX + GRID_SIZE - 6; eye1Y = headY + 4;
                eye2X = headX + GRID_SIZE - 6; eye2Y = headY + GRID_SIZE - 7;
            } else if (dirX === -1) { // Left
                eye1X = headX + 3; eye1Y = headY + 4;
                eye2X = headX + 3; eye2Y = headY + GRID_SIZE - 7;
            } else if (dirY === 1) { // Down
                eye1X = headX + 4; eye1Y = headY + GRID_SIZE - 6;
                eye2X = headX + GRID_SIZE - 7; eye2Y = headY + GRID_SIZE - 6;
            } else { // Up
                eye1X = headX + 4; eye1Y = headY + 3;
                eye2X = headX + GRID_SIZE - 7; eye2Y = headY + 3;
            }

            // White eye balls
            ctx.fillRect(eye1X, eye1Y, eyeSize, eyeSize);
            ctx.fillRect(eye2X, eye2Y, eyeSize, eyeSize);

            // Pupils
            ctx.fillStyle = '#000000';
            ctx.fillRect(eye1X + 1, eye1Y + 1, pupilSize, pupilSize);
            ctx.fillRect(eye2X + 1, eye2Y + 1, pupilSize, pupilSize);
        }

        function draw() {
            // Background Grid
            ctx.fillStyle = '#0f1015';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle grid pattern
            ctx.strokeStyle = '#181a22';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw Fruit Balls with Glow
            fruits.forEach(f => {
                const fruitCenterX = f.x * GRID_SIZE + GRID_SIZE / 2;
                const fruitCenterY = f.y * GRID_SIZE + GRID_SIZE / 2;
                const radius = (GRID_SIZE / 2) - 2;

                ctx.save();
                ctx.shadowColor = f.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(fruitCenterX, fruitCenterY, radius, 0, Math.PI * 2);
                ctx.fillStyle = f.color;
                ctx.fill();
                ctx.restore();
            });

            // Draw Bot Snakes
            botSnakes.forEach(bot => {
                if (!bot.alive) return;
                bot.body.forEach((segment, index) => {
                    const segX = segment.x * GRID_SIZE;
                    const segY = segment.y * GRID_SIZE;
                    const isHead = index === 0;

                    ctx.fillStyle = isHead ? bot.headColor : bot.bodyColor;
                    ctx.beginPath();
                    ctx.roundRect(segX + 1, segY + 1, GRID_SIZE - 2, GRID_SIZE - 2, isHead ? 6 : 4);
                    ctx.fill();

                    if (isHead) {
                        drawSnakeEyes(segX, segY, bot.dx, bot.dy);
                    }
                });
            });

            // Draw Player Snake
            if (playerSnake.alive) {
                playerSnake.body.forEach((segment, index) => {
                    const segX = segment.x * GRID_SIZE;
                    const segY = segment.y * GRID_SIZE;
                    const isHead = index === 0;

                    ctx.fillStyle = isHead ? playerSnake.headColor : playerSnake.bodyColor;
                    ctx.beginPath();
                    ctx.roundRect(segX + 1, segY + 1, GRID_SIZE - 2, GRID_SIZE - 2, isHead ? 6 : 4);
                    ctx.fill();

                    if (isHead) {
                        drawSnakeEyes(segX, segY, playerSnake.dx, playerSnake.dy);
                    }
                });
            }
        }

        function handleGameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            finalScoreElement.textContent = score;
            finalKillsElement.textContent = kills;
            gameOverModal.style.display = 'block';
        }

        window.addEventListener('keydown', (e) => {
            const key = e.key;

            if ((key === 'ArrowUp' || key === 'w' || key === 'W') && playerSnake.dy === 0) {
                playerSnake.nextDx = 0;
                playerSnake.nextDy = -1;
            } else if ((key === 'ArrowDown' || key === 's' || key === 'S') && playerSnake.dy === 0) {
                playerSnake.nextDx = 0;
                playerSnake.nextDy = 1;
            } else if ((key === 'ArrowLeft' || key === 'a' || key === 'A') && playerSnake.dx === 0) {
                playerSnake.nextDx = -1;
                playerSnake.nextDy = 0;
            } else if ((key === 'ArrowRight' || key === 'd' || key === 'D') && playerSnake.dx === 0) {
                playerSnake.nextDx = 1;
                playerSnake.nextDy = 0;
            }
        });

        restartBtn.addEventListener('click', initGame);

        // Start initial game
        initGame();
    </script>
</body>
</html>
